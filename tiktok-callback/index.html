<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>TikTok Connected — ELVYN Labs</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { background:#0b0f17; color:#e2e8f0; font-family:Inter,system-ui,sans-serif; margin:0; }
    .wrap { max-width:640px; margin:12vh auto; padding:0 16px; }
    h1 { font-size:1.6rem; margin:0 0 .5rem; }
    code { display:block; word-break:break-all; background:#111827; border:1px solid #334155; border-radius:10px; padding:14px; margin:14px 0; font-size:.95rem; }
    button { background:#38bdf8; color:#0b0f17; border:0; border-radius:10px; padding:12px 18px; font-weight:700; font-size:1rem; cursor:pointer; }
    .err { color:#f87171; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="h">Connecting TikTok…</h1>
    <p id="p"></p>
    <code id="code" hidden></code>
    <button id="copy" hidden>Copy code</button>
  </div>
  <script>
    var q = new URLSearchParams(location.search);
    var code = q.get('code'), err = q.get('error');
    var h = document.getElementById('h'), p = document.getElementById('p');
    if (code) {
      h.textContent = 'TikTok connected';
      p.textContent = 'Copy this code and paste it into the ELVYN Poster in Terminal. It expires in a few minutes.';
      var c = document.getElementById('code'); c.textContent = code; c.hidden = false;
      var b = document.getElementById('copy'); b.hidden = false;
      b.onclick = function () { navigator.clipboard.writeText(code).then(function(){ b.textContent = 'Copied'; }); };
    } else {
      h.textContent = 'TikTok not connected';
      p.className = 'err';
      p.textContent = err ? ('TikTok said: ' + err + ' ' + (q.get('error_description') || '')) : 'No code was returned. Try connecting again.';
    }
  </script>
</body>
</html>
